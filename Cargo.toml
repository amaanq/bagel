[workspace]
resolver = "3"
members  = [ "crates/*" ]

[workspace.package]
version      = "2.0.2"
edition      = "2024"
rust-version = "1.91.0"
authors      = [ "NotAShelf <raf@notashelf.dev>" ]
description  = "HTTP proxy and SSH tarpit daemon that delays malicious scanners"

[workspace.dependencies]
# Internal crates
eris-core      = { path = "crates/eris-core" }
eris-config    = { path = "crates/eris-config" }
eris-proto     = { path = "crates/eris-proto" }
eris-deception = { path = "crates/eris-deception" }
eris-admin     = { path = "crates/eris-admin" }
eris-runtime   = { path = "crates/eris-runtime" }

# External
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
    "sync",
    "signal",
    "process",
    "fs",
] }
tokio-util = { version = "0.7.19", features = [ "rt" ] }
httparse = "1.10.1"
ppp = "2.3.0"
clap = { version = "4.6.6", features = [ "derive", "env" ] }
serde = { version = "1.0.229", features = [ "derive" ] }
serde_json = "1.0.151"
regex = "1.13.1"
ipnetwork = "0.21.1"
jiff = "0.2.35"
libc = "0.2.189"
rand = "0.10.2"
rusqlite = { version = "0.40.2", features = [ "bundled" ] }
markov = "1.1.0"
mlua = { version = "0.12.0", features = [ "lua54", "vendored", "send" ] }
prometheus = "0.14.0"
directories = "6.0.0"
dashmap = "6.2.1"
parking_lot = "0.12.5"
anyhow = "1.0.104"
thiserror = "2.0.20"
log = "0.4.34"
env_logger = "0.11.11"

[profile.release]
codegen-units = 1
lto           = "thin"
strip         = true
